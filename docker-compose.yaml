name: travelmate-backend-api

x-api: &api
  image: travelmate-backend-api:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    NODE_ENV: development
    PORT: "5000"
  init: true

services:
  migrate:
    <<: *api
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *api
    ports:
      - "127.0.0.1:${TRAVELMATE_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
