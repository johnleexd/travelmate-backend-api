name: travelmate-backend

x-api: &api
  image: ${TRAVELMATE_IMAGE:-johnlyy/travelmate:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-development}
    PORT: "8000"
  init: true

services:
  migrate:
    <<: *api
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *api
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:${TRAVELMATE_PORT:-8002}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s
