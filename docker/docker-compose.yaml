name: travelmate-backend

x-api: &api
  image: ${TRAVELMATE_IMAGE:-johnlyy/travelmate:latest}
  env_file:
    - ${TRAVELMATE_ENV_FILE:-/root/env/travelmate-backend/.env}
  environment:
    NODE_ENV: production
    PORT: "8000"
  init: true
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *api
    profiles: ["tools"]
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *api
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    ports:
      - "127.0.0.1:${TRAVELMATE_PORT:-8002}:8000"
    restart: unless-stopped
    stop_grace_period: 30s
